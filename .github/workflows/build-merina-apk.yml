name: Build Merina APK

permissions:
  contents: write

on:
  push:
    branches: [merina-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: merina-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Merina-apk
          path: merina-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Save APK on branch apk-output
        working-directory: ${{ github.workspace }}
        run: |
          mkdir /tmp/out && cp merina-android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/Merina.apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan apk-output && git rm -rfq . && cp /tmp/out/Merina.apk . && git add Merina.apk
          git commit -qm "Merina APK" && git push -f origin apk-output
